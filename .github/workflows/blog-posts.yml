name: latest-blog-posts
# 티스토리 RSS가 GitHub 러너 요청을 406으로 차단해 잠정 비활성화 (수동 실행만 가능).
# 추후 연동 시 아래 트리거를 복구하세요:
#   push: { branches: [main] }
#   schedule: [{ cron: "0 */12 * * *" }]
on:
  workflow_dispatch:
jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: update blog post list
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://jjunii486.tistory.com/rss"
          user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          max_post_count: 5
          date_format: "yyyy.mm.dd"
          template: "- **[$title]($url)** <sub>$date</sub>$newline"
          commit_message: "chore: update latest blog posts"
