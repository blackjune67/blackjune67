name: generate-snake
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: blackjune67
          outputs: |
            dist/github-snake.svg?color_snake=#0d9488&color_dots=#ebedf0,#c7f0e5,#8ce0cb,#41c4a7,#0d9488
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#161b22,#0f3d33,#12604f,#1aa179,#2dd4bf
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
